[project]
name = "dwta-classifier"
version = "1.0.0"
description = "B5 classifier: single content pass, rules + Magika typing, oletools, YARA-X, versions, alerts"
requires-python = ">=3.12"
dependencies = ["dwta-core", "dwta-ledger", "oletools>=0.60", "yara-x>=1.0"]

[project.optional-dependencies]
ai = ["magika>=1.0"]

[project.scripts]
dwta-classifier = "dwta_classifier.main:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.sources]
dwta-core = { workspace = true }
dwta-ledger = { workspace = true }
