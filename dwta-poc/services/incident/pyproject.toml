[project]
name = "dwta-incident"
version = "1.0.0"
description = "B9/B10 incident intake and pre-restore review engine"
requires-python = ">=3.12"
dependencies = ["dwta-core", "dwta-ledger"]

[project.scripts]
dwta-incident = "dwta_incident.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.sources]
dwta-core = { workspace = true }
dwta-ledger = { workspace = true }
