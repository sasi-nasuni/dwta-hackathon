# Extension -> type classes it may legitimately hold (rule R-EXT). Extensions not listed: mismatch = unknown.
version = "1.0"

[ext]
pdf = ["pdf"]
doc = ["office_doc", "office_macro"]
docx = ["office_doc"]
docm = ["office_macro", "office_doc"]
dot = ["office_doc", "office_macro"]
dotm = ["office_macro", "office_doc"]
xls = ["office_doc", "office_macro"]
xlsx = ["office_doc"]
xlsm = ["office_macro", "office_doc"]
ppt = ["office_doc", "office_macro"]
pptx = ["office_doc"]
pptm = ["office_macro", "office_doc"]
rtf = ["text", "office_doc"]
csv = ["text"]
txt = ["text", "test_signature"]
log = ["text"]
md = ["text"]
json = ["text"]
xml = ["text"]
html = ["text", "script"]
png = ["image"]
jpg = ["image"]
jpeg = ["image"]
gif = ["image"]
zip = ["archive"]
gz = ["archive"]
7z = ["archive"]
rar = ["archive"]
exe = ["pe_binary"]
dll = ["pe_binary"]
scr = ["pe_binary"]
msi = ["office_doc"]
lnk = ["lnk_shortcut"]
sh = ["script", "text"]
ps1 = ["script", "text"]
bat = ["script", "text"]
cmd = ["script", "text"]
vbs = ["script", "text"]
js = ["script", "text"]
py = ["script", "text"]
