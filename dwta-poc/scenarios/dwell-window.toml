# The demo story (spec §5.3.3): plant on Day 1, threat intel on Day 5, encryption + incident on Day 7.
name        = "dwell-window"
description = "Plant a disguised executable on Day 1, publish its hash on Day 5, encrypt the finance share on Day 7"
sim_epoch   = "2026-11-02T00:00:00Z"
corpus      = "default-42"

[[step]]
at = "D1 08:00"
actor = "client-admin"
action = "seed"

[[step]]
at = "D1 09:00"
actor = "client-jdoe"
action = "edit"
share = "finance"
count = 3
style = "office"

[[step]]
id = "plant"
at = "D1 09:14"
actor = "client-attack"
as = "svc-backup"
action = "plant"
share = "finance"
path = "/Q3/Q3-Report.pdf"
artifact = "benign_pe"

[[step]]
at = "D1 14:30"
actor = "client-asmith"
action = "edit"
share = "finance"
count = 3
style = "office"

[[step]]
at = ["D2 10:00", "D3 10:00", "D4 10:00"]
actor = "client-jdoe"
action = "edit"
share = "finance"
count = 2
style = "office"

[[step]]
at = "D5 10:00"
action = "publish_feed"
include_artifacts = ["benign_pe"]   # their SHA-256 go into the feed
file_name = "Q3-Report.pdf"
decoys = 200                        # deterministic random hashes, never match

[[step]]
at = "D5 11:00"
actor = "client-asmith"
action = "edit"
share = "finance"
count = 2
style = "office"

[[step]]
at = "D6 10:00"
actor = "client-jdoe"
action = "edit"
share = "finance"
count = 2
style = "office"

[[step]]
id = "attack"
at = "D7 02:00"
actor = "client-attack"
as = "svc-backup"
action = "encrypt"
share = "finance"
paths = "*"
rate = 20

[[step]]
at = "D7 02:05"
action = "raise_incident"
from_step = "attack"                # user, IP, machine, volume: what the product detects
restore_time = "D1 00:00"           # admin: latest moment with no attacker presence (D-22)
