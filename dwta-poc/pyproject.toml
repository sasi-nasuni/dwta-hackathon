[project]
name = "dwta-poc"
version = "1.0.0"
description = "Dwell-Window Threat Assurance POC: workspace root (not a distributable package)"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*", "tools/*"]

[tool.uv.sources]
dwta-core = { workspace = true }
dwta-ledger = { workspace = true }
dwta-sim = { workspace = true }
dwta-collector = { workspace = true }
dwta-classifier = { workspace = true }
dwta-matcher = { workspace = true }
dwta-incident = { workspace = true }

[dependency-groups]
dev = [
    "dwta-core",
    "dwta-ledger",
    "dwta-sim",
    "dwta-collector",
    "dwta-classifier",
    "dwta-matcher",
    "dwta-incident",
    "pytest>=8",
    "jsonschema>=4.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/dwta-core/tests",
    "packages/dwta-ledger/tests",
    "tools/dwta-sim/tests",
    "services/collector/tests",
    "services/classifier/tests",
    "services/matcher/tests",
    "services/incident/tests",
]
addopts = "-q --import-mode=importlib"
markers = [
    "lab: needs the running Docker lab (deselect with -m 'not lab')",
    "db: needs a reachable ledger database",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM905", "E731"]
